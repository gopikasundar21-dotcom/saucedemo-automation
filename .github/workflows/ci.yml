name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest pytest-html allure-pytest openpyxl; fi

      - name: Run tests (generate Allure results)
        run: |
          pytest -q --maxfail=1 --disable-warnings --alluredir=allure_results || true

      - name: Generate HTML/Excel report
        run: |
          python generate_report.py || true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure_results

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: report.html

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        with:
          name: excel-report
          path: TestExecutionReport.xlsx
