name: Saucedemo Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install selenium pytest pytest-html allure-pytest openpyxl pytest-ordering

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Run tests
      run: |
        pytest tests/test_pom.py -v --html=report.html --self-contained-html --junitxml=results.xml
      continue-on-error: true

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: report.html

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots
        path: screenshots/

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: junit-results
        path: results.xml
